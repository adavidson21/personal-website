name: HTTPS check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  https-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-notes.mjs --check
      - run: bash scripts/check-https.sh
      - run: bash scripts/stamp-assets.sh --check
