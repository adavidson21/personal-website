<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Alexis Davidson</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'">
  <style>
    @font-face { font-family: Inter; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
    @font-face { font-family: "Source Serif 4"; font-weight: 200 900; font-display: swap; src: url(/fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-display: swap; src: url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); }
    :root { --bg: #F4F1EA; --text: #2A2627; --muted: #675F5A; --link: #82263C; --oak: #8B6340; color-scheme: light; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 96px 24px; }
    .eyebrow { font: 500 12px/1.4 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--oak); margin: 0 0 18px; }
    h1 { font: 600 clamp(44px, 8vw, 64px)/1.02 "Source Serif 4", Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -.03em; margin: 0 0 20px; }
    h1 span { color: var(--oak); }
    p { color: var(--muted); }
    a { color: var(--link); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Page not found<span>.</span></h1>
    <p>That page doesn't exist. <a href="/">Go to the home page</a>.</p>
  </main>
</body>
</html>
